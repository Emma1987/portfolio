name: Symfony Tests

on:
    push:
    pull_request:

jobs:
    symfony-tests:
        name: Symfony Tests
        runs-on: ubuntu-latest

        env:
            APP_ENV: test
            DATABASE_URL: mysql://root:symfony@127.0.0.1:3306/symfony

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: false
                    MYSQL_ROOT_PASSWORD: symfony
                    MYSQL_DATABASE: symfony
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

        strategy:
            fail-fast: true
            matrix:
                php-versions: [ '8.3' ]

        steps:
             # —— Setup Github actions 🐙 —————————————————————————————————————————————
            - name: 📥 Checkout code
              uses: actions/checkout@v3

            - name: 🧰 Setup PHP and extensions
              uses: shivammathur/setup-php@v2
              with:
                php-version: ${{ matrix.php-versions }}
                extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom
              env:
                update: true

            - name: 🐘 Check PHP version
              run: php -v

            # —— Composer 🧙‍️ —————————————————————————————————————————————————————————
            - name: 🧾 Validate composer files
              run: composer validate --no-check-publish

            - name: 💾 Cache Composer download cache
              uses: actions/cache@v3
              with:
                path: ~/.composer/cache
                key: ${{ runner.os }}-composer-cache-${{ hashFiles('**/composer.lock') }}

            - name: 📦 Install PHP dependencies
              run: composer install --prefer-dist --no-progress --no-scripts

            ## —— JS dependencies 🐱 —————————————————————————————————————————————————
            - name: ⚙️ Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'

            - name: 🧶 Install JS dependencies
              run: npm install

            - name: 🏗️ Build frontend assets
              run: npm run build

            ## —— Tests ✅ ———————————————————————————————————————————————————————————
            - name: 🏗️ Prepare test database
              run: |
                php bin/console doctrine:database:drop --if-exists --force --env=test
                php bin/console doctrine:database:create --if-not-exists --env=test
                php bin/console doctrine:migrations:migrate --env=test || echo "No migrations found or migration failed"
                php bin/console doctrine:fixtures:load --no-interaction --env=test

            - name: ✅ Run PHPUnit tests
              run: php bin/phpunit
