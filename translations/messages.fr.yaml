    intro_text1: Moi c'est Emmanuelle, développeuse backend qui aime créer des applications à la fois utiles et agréables à utiliser (alors forcément, je fais aussi un peu de JavaScript côté front).
    intro_text2: J'aime aussi les cafés Starbucks ☕, les orages ⛈️ et la photographie 📸.
    learning_title: Le commencencement
    learning_text: Je me suis formée via le parcours %link% Développeur d'applications PHP/Symfony, et je n'ai pas arrêté d'apprendre depuis.
    skills_title: Ma boîte à outils
    skills_text: |
        Langages :<br><ul><li>PHP 6/7/8 🐘</li><li>JavaScript 💻 (notions en VueJS et React)</li><li>HTML5 & CSS3 🎨</li><li>SQL (MySQL, PostgreSQL) 🗄️</li></ul>
        Frameworks :<br><ul><li>Symfony 4/5/6 ⚙ & PHPUnit 🧪️️</li><li>Bootstrap 🧩</li><li>jQuery 🕸️</li></ul>
        Outils :<br><ul><li>Git & GitHub 🧬️</li><li>Bitbucket & Jira 📋️</li><li>Docker 🐳️</li><li>Caféine ☕</li></ul>
        Méthodes :<br><ul><li>Pair programming 👯‍♀️</li><li>Code review 🔍</li></ul>
        <p>Je fais attention au code propre, à l'accessibilité, et au confort des développeurs.</p>
    outro: En résumé, je crée des trucs qui marchent, qui sont jolis, et bien sûr que non, je n'ai jamais développé en PHP6.
